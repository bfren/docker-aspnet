name: build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    uses: bfren/docker/.github/workflows/build.yml@shared-build
    with:
      image: aspnet
      folders: |
        8
        9
        10
        11
      platforms: |
        linux/amd64
        linux/arm/v7
        linux/arm64
      tags: |
        net${FOLDER}
        net${FOLDER}-${VERSION_MAJOR}
        net${FOLDER}-${VERSION_MINOR}
        net${FOLDER}-${VERSION}
        net${DOTNET_REVISION}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
